[project]
name = "belegbot"
version = "0.1.0"
description = "Steuerbeleg-App backend (FastAPI, Postgres)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2",
    "psycopg[binary]>=3",
    "alembic",
    "cryptography>=50.0.2",
    "structlog>=26.1.0",
    "honcho>=2.0.0",
    "opentelemetry-sdk>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b0",
    "httpx>=0.28.1",
    "email-validator>=2.3.0",
    "openai>=3.24.0",
    "pillow>=12.3.0",
    "pypdfium2>=5.14.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "httpx",
    "respx>=0.23.1",
    "pypdf>=6.19.0",
    "types-pyyaml>=6.0.12.20260906",
    "reportlab>=5.0.1",
    "pillow>=12.3.0",
    "pypdfium2>=5.14.0",
    "pyyaml>=6.0.3",
    "types-reportlab>=5.0.0.20260911",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: calls a real paid LLM API; needs OPENAI_API_KEY (run with `uv run pytest -m live`)",
]
