# One-line guidance per enum code, rendered into the {{...}} blocks of this prompt set
# (code, German label from LABELS_DE, guidance). Part of the v2 hash: never edit, create v3.
categories:
  wk_arbeitsmittel: "work equipment used for the job (Notebook, Fachbuch, Werkzeug, Berufskleidung)"
  wk_fortbildung: "job-related training (Seminar, Kurs, Fachkonferenz, berufliche Sprachkurse)"
  wk_fahrtkosten: "job-related travel not reimbursed by the employer (Dienstreise-Ticket, Hotel)"
  wk_homeoffice: "home-office lump sum; practically never on a receipt"
  wk_arbeitszimmer: "costs or furnishing of a home office room (Arbeitszimmer)"
  wk_bewerbung: "job application costs (Bewerbungsfotos, Mappen, Porto)"
  wk_kontofuehrung: "account fees of a salary account (Kontoführungsentgelt)"
  wk_berufsverband: "trade union or professional association fees (Gewerkschaft, Berufsverband)"
  wk_doppelte_haushaltsfuehrung: "second home at the place of work (Miete Zweitwohnung)"
  steuerberatung: "tax adviser fees for work-related parts (Anlage N, Werbungskosten)"
  vorsorge_kv_pv: "health and long-term care insurance contributions (Basisabsicherung KV / PV)"
  vorsorge_rv: "pension insurance contributions (gesetzliche / freiwillige Rentenversicherung)"
  vorsorge_riester: "Riester contract contributions (Bescheinigung nach § 92 EStG)"
  vorsorge_ruerup: "Rürup / Basisrente contributions"
  vorsorge_sonstige: "other insurance (Haftpflicht, Unfall, Berufsunfähigkeit)"
  spenden: "donations to charities (Zuwendungsbestätigung, Sachspende, Überweisung an e.V.)"
  kirchensteuer: "church tax paid directly (Nachzahlung, Kirchgeld)"
  kinderbetreuung: "child care only (Kita, Tagesmutter, Hort); never meals or tuition"
  schulgeld: "private school fees; never meals"
  krankheitskosten: "medical costs (Arzt, Zahnarzt, Brille, Physiotherapie, prescribed medicine)"
  pflege: "nursing care costs (Pflegedienst, Pflegeheim, Eigenanteil)"
  behinderung: "disability-related costs (Umbau, Hilfsmittel, Fahrdienst)"
  haushaltsnahe_dienstleistung: "household services in the own home (Reinigung, Haushaltshilfe, Gartenpflege, Winterdienst)"
  handwerkerleistung: "craftsman work in an existing home (Maler, Sanitär, Heizungswartung, Schornsteinfeger)"
  v_afa: "depreciation of a rented-out property; computed elsewhere, never from a receipt"
  v_schuldzinsen: "loan interest for a rented-out property (Zinsbescheinigung)"
  v_erhaltung: "repairs / maintenance of a rented-out property"
  v_nebenkosten: "running costs of a rented-out property (Grundsteuer, Gebäudeversicherung)"
  kapital_bescheinigung: "capital income certificate (only with doc_type jahressteuerbescheinigung)"
  irrelevant: "private costs that are not deductible (Lebensmittel, Restaurant, Kleidung, Freizeit, Tanken, Parken, Kosmetik)"
doc_types:
  generic_bill: "every receipt, invoice, Beitragsrechnung / Beitragsbescheinigung (any insurance, union, association), Zuwendungsbestätigung (money or Sachspende), Jahres- / Gebührenbescheinigung (Kita, Tagesmutter, Schule), Miet-, Zins- or Abgabenbescheinigung, bank statement excerpt"
  lohnsteuerbescheinigung: "only the employer's 'Ausdruck der elektronischen Lohnsteuerbescheinigung' (Bruttoarbeitslohn, Lohnsteuer, numbered lines)"
  jahressteuerbescheinigung: "only a bank's / broker's 'Jahressteuerbescheinigung' on Kapitalerträge"
  nebenkostenabrechnung: "only a landlord's / Hausverwaltung's annual Betriebs- or Nebenkostenabrechnung of a flat"
  kindergeld_bescheid: "only a Familienkasse decision ('Bescheid über Kindergeld'); never a Kita or Tagesmutter statement"
  elterngeld_bescheid: "only an Elterngeldstelle decision ('Bescheid über Elterngeld'); never an insurance statement"
  alg_bescheid: "only an Agentur für Arbeit decision on Arbeitslosengeld"
  other: "only documents without any amount paid by the household (letters, contracts, photos without a bill); never a statement or certificate of payments"
payment_methods:
  cash: "Barzahlung, 'bar', 'Gegeben / Rückgeld' on a till receipt"
  bank_transfer: "Überweisung, Dauerauftrag, 'Zahlungseingang', bank statement transfer"
  direct_debit: "Lastschrift, SEPA-Lastschrift, 'eingezogen'"
  card: "EC / Girocard, Kreditkarte, Kartenzahlung, card terminal slip"
  paypal: "PayPal"
  other: "visible but none of the above (e.g. a Sachspende, Gutschein)"
  unknown: "no payment method visible"
