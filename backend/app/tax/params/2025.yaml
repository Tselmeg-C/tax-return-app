werbungskosten: # §§ 9, 9a EStG, § 4 Abs. 5 Satz 1 Nr. 6c EStG (#15)
  source: "§ 9a Satz 1 Nr. 1 Buchst. a EStG (Arbeitnehmer-Pauschbetrag 1.230 Euro, seit VZ 2023 durch Art. 4 JStG 2022 v. 16.12.2022, BGBl. 2022 I S. 2294); § 9 Abs. 1 Satz 3 Nr. 4 Satz 2 und 8 EStG (Entfernungspauschale: VZ 2021 bis 2026 0,30 Euro je Kilometer für die ersten 20 km, 0,38 Euro ab dem 21. km; Höchstbetrag 4.500 Euro bei Nicht-Kfz-Nutzung) i.d.F. vor Art. 2 StÄndG 2025; § 4 Abs. 5 Satz 1 Nr. 6c i.V.m. § 9 Abs. 5 Satz 1 EStG (Tagespauschale 6 Euro, höchstens 1.260 Euro). Read 2026-10-08 at buzer.de/9_EStG.htm, 9a_EStG.htm, 4_EStG.htm and buzer.de/gesetz/4499/al233627-0.htm (a.F. of § 9 up to 31.12.2025); gesetze-im-internet.de was not reachable. § 9a Satz 3 (Gewerkschaftsbeiträge neben dem Pauschbetrag) applies only from VZ 2026."
  arbeitnehmer_pauschbetrag: "1230" # § 9a Satz 1 Nr. 1 Buchst. a
  entfernungspauschale: # § 9 Abs. 1 Satz 3 Nr. 4
    rate_km_1_to_20: "0.30"
    rate_from_km_21: "0.38"
    max_without_car: "4500" # stored, NOT applied in v1 (#74)
  homeoffice: # § 4 Abs. 5 Satz 1 Nr. 6c
    per_day: "6"
    max_amount: "1260" # = 210 days
  union_dues_beside_pauschbetrag: false # § 9a Satz 3 (new from VZ 2026)

sonderausgaben: # §§ 10 Abs. 1 Nr. 4, 5, 9, 10b Abs. 1, 10c EStG (#15)
  source: "§ 10c EStG (Sonderausgaben-Pauschbetrag 36 Euro, doppelt bei Zusammenveranlagung; Fassung Art. 5 ZollkodexAnpG v. 22.12.2014, BGBl. 2014 I S. 2417, unverändert); § 10b Abs. 1 Satz 1 Nr. 1 EStG (20 % des Gesamtbetrags der Einkünfte; VZ 2026: Art. 2 StÄndG 2025 ändert nur Abs. 2); § 10 Abs. 1 Nr. 5 EStG i.d.F. Art. 4 JStG 2024 v. 2.12.2024 (BGBl. 2024 I Nr. 387), m.W.v. 1.1.2025: 80 % der Aufwendungen, höchstens 4.800 Euro je Kind (vorher zwei Drittel / 4.000 Euro), Kind unter 14 Jahren, Rechnung und Überweisung (Satz 4); § 10 Abs. 1 Nr. 9 EStG: 30 % des Entgelts, höchstens 5.000 Euro (cap on the deductible amount, reading of the sentence, see PR), Schule in freier Trägerschaft, ohne Beherbergung, Betreuung, Verpflegung; § 10 Abs. 1 Nr. 4 EStG (gezahlte Kirchensteuer). Read 2026-10-08 at buzer.de/10_EStG.htm, 10b_EStG.htm, 10c_EStG.htm and buzer.de/gesetz/4499/al210133-0.htm (a.F. before JStG 2024); gesetze-im-internet.de was not reachable. § 4f EStG named in the issue is Schuldübernahme and not relevant."
  pauschbetrag_single: "36" # § 10c Satz 1
  pauschbetrag_joint: "72" # § 10c Satz 2
  spenden_max_share_of_gde: "0.20" # § 10b Abs. 1 Satz 1 Nr. 1
  kinderbetreuung: {share: "0.80", max_per_child: "4800", age_limit: 14} # § 10 Abs. 1 Nr. 5
  schulgeld: {share: "0.30", max_per_child: "5000"} # § 10 Abs. 1 Nr. 9

vorsorge: # § 10 Abs. 1 Nr. 2, 3, 3a, Abs. 3, 4 EStG (#16)
  source: "§ 10 Abs. 3 Satz 1 EStG (Höchstbeitrag zur knappschaftlichen Rentenversicherung, aufgerundet; 100 % ab VZ 2023, Satz 6), Fassung Art. 4 JStG 2024 v. 2.12.2024 (BGBl. 2024 I Nr. 387) m.W.v. 1.1.2025, no later version of Abs. 1 Nr. 2/3/3a, Abs. 3, 4 in the version list; § 10 Abs. 4 Satz 1, 2 (2.800 / 1.900 Euro); § 10 Abs. 1 Nr. 3 Buchst. a Satz 4 (Kürzung um 4 Prozent). Höchstbetrag 2025: § 4 Abs. 1 Nr. 2 SVBezGrV 2025 (knappschaftliche BBG 118 800 Euro, V. v. 25.11.2024 BGBl. 2024 I Nr. 365) x Beitragssatz 24,7 % (Bekanntmachung v. 19.11.2024 BGBl. 2024 I Nr. 368) = 29.343,60, aufgerundet 29.344. Read 2026-10-09 at buzer.de/10_EStG.htm, lxgesetze.de/svbezgrv-2025/4, buzer.de/SVRechGrV_2025.htm and the Bekanntmachung text (jurawelt mirror of gesetze-im-internet.de); gesetze-im-internet.de itself was not reachable."
  altersvorsorge_hoechstbetrag: "29344" # joint: doubled in code (Satz 2)
  krankengeld_cut: "0.04" # Nr. 3 Buchst. a Satz 4
  basis_cap: "2800" # Abs. 4 Satz 1
  basis_cap_reduced: "1900" # Abs. 4 Satz 2

progressionsvorbehalt: # § 32b EStG (#86)
  provisional: true # only the rounding of the besonderer Steuersatz is unconfirmed (see source)
  source: "§ 32b Abs. 1 Satz 1 Nr. 1 Buchst. a bis k EStG (Lohnersatzleistungen: Arbeitslosengeld, Kurzarbeitergeld, Insolvenzgeld, Krankengeld, Mutterschaftsgeld, Elterngeld u. a.) und § 32b Abs. 2 Nr. 1 EStG (besonderer Steuersatz = Steuersatz auf zvE + Summe der Leistungen nach Abzug des Arbeitnehmer-Pauschbetrags, soweit nicht bei den Einkünften aus nichtselbständiger Arbeit abziehbar), i.d.F. der Neufassung v. 8.10.2009 (BGBl. 2009 I S. 3366, 3862), zuletzt geändert durch Art. 7 G. v. 29.6.2026 (BGBl. 2026 I Nr. 197); § 32b Abs. 3 (Bescheinigung der Träger nach § 93c AO) is data delivery only. Read 2026-10-09 at buzer.de/32b_EStG.htm; gesetze-im-internet.de was not reachable. The law text has no rounding rule for the rate and no minimum rate; the rule the Finanzverwaltung applies (e.g. 4 decimals, R 32b EStR) is UNCONFIRMED, therefore rate_decimals exact and provisional true (issue #86 Decision 4)."
  rate_decimals: "exact" # "exact" or a digit string "0".."8"

agb: # §§ 33, 33b EStG (#76)
  source: "§ 33 Abs. 3 Satz 1 EStG (zumutbare Belastung: Gesamtbetrag der Einkünfte bis 15.340 / bis 51.130 / darüber, Prozentsätze 5/6/7 ohne Kinder Grundtarif, 4/5/6 ohne Kinder Splitting, 2/3/4 bei einem oder zwei Kindern, 1/1/2 bei drei oder mehr Kindern) und Satz 2 (Kinder = Anspruch auf Freibetrag nach § 32 Abs. 6 oder Kindergeld), i.d.F. Art. 1 G. v. 9.12.2020 (BGBl. 2020 I S. 2770) m.W.v. 15.12.2020, unverändert; stufenweise Berechnung: BFH v. 19.1.2017 VI R 75/14; § 33b Abs. 3 Satz 2 und 3 EStG (Behinderten-Pauschbetrag 384 bis 2.840 Euro je Grad der Behinderung, 7.400 Euro bei Hilflosigkeit, Blindheit, Taubblindheit), i.d.F. Art. 1 G. v. 9.12.2020 (BGBl. 2020 I S. 2770), Absatz 3 in späteren Fassungen (JStG 2024, BGBl. 2024 I Nr. 387, m.W.v. 1.1.2026) unverändert. Read 2026-10-09 at buzer.de/33_EStG.htm and buzer.de/33b_EStG.htm (consolidated to 29.6.2026); gesetze-im-internet.de was not reachable. All constants confirmed for VZ 2025 and VZ 2026. Not in the law: the rounding of the zumutbare Belastung to cents (half-up, user decision on #76)."
  zumutbare_belastung:
    bracket1_upper: "15340"
    bracket2_upper: "51130"
    rates: # share of the part of the GdE in bracket 1 / 2 / 3
      no_children_single: ["0.05", "0.06", "0.07"] # Nr. 1 Buchst. a
      no_children_joint: ["0.04", "0.05", "0.06"] # Nr. 1 Buchst. b
      one_or_two_children: ["0.02", "0.03", "0.04"] # Nr. 2 Buchst. a
      three_plus_children: ["0.01", "0.01", "0.02"] # Nr. 2 Buchst. b
  behinderten_pauschbetrag: # § 33b Abs. 3 Satz 2, by Grad der Behinderung
    "20": "384"
    "30": "620"
    "40": "860"
    "50": "1140"
    "60": "1440"
    "70": "1780"
    "80": "2120"
    "90": "2460"
    "100": "2840"
  hilflos_blind: "7400" # § 33b Abs. 3 Satz 3 (Merkzeichen H, Bl, TBl)

