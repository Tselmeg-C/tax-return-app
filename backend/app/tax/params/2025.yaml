church_tax:
  provisional: true
  source: "#53, read 2026-10-13. Rates (Kirchensteuerbeschlüsse, as announced by the Länder): SN 9 % (Bek. SMF Sachsen v. 28.03.2025 for 2025, 28.04.2026 for 2026, steuern.sachsen.de/download/KiStB_2025.pdf / _2026.pdf), NW 9 % (FinMin NRW Erlass v. 17.11.2025, BStBl. 2025 I S. 2060, via deubner-steuern.de and datenbank.nwb.de/Dokument/1086351), NI 9 % (FinMin NI, BStBl. 2025 I S. 1172, datenbank.nwb.de/Dokument/1070543), BE / BB / MV / ST 9 % (KiStB kath. Erzbistum Berlin v. 22.11.2024, ABl. 12/2024, Evangelische Kirchen of those Länder not read). NOT read in a primary text (only secondary summaries: haufe.de Kirchensteuersätze 2025, lohnsteuer-kompakt.de, search snippets): BW 8 % (FinMin BW Erlass v. 06.02.2025, BStBl. 2025 I S. 420, paywalled), BY 8 %, HB, HH, HE, RP, SL, SH, TH 9 %. Rounding: fractions of a cent are dropped for BY (§ 9 Abs. 2 AVKirchStG, gesetze-bayern.de); no text read for the other Länder (assumed alike). Member share in glaubensverschiedener Ehe: BY Art. 9 Abs. 2 Nr. 2 KirchStG (ESt of the joint return split by the ratio of the Summe der Einkünfte), the Sachsen Bek. Nr. 1 and Erzbistum Berlin § 2 Abs. 1 say the same for the Kappung; the engine uses that ratio with the Summe der Einkünfte approximated by the Gesamtbetrag der Einkünfte per person (#53). Kirchgeld (kirchgeld): table of the Sachsen Bek. Nr. 3 (2025 and 2026, identical) = NW Erlass 2025 (table read in datenbank.nwb.de/Dokument/1086351) = NI 2025 (stage 1 read) = Erzbistum Berlin KiStB kath. § 3 Abs. 2; Vergleichsberechnung, the higher amount is charged (Sachsen Bek. Nr. 3, NI 2025); Bemessungsgrundlage = zvE after the Kinderfreibeträge (§ 51a Abs. 2 EStG, Sachsen Bek. Nr. 3). compare_states: SN confirmed 2025 + 2026, NW and NI confirmed 2025 only (2026 Erlasse of 13.04.2026 / 01.04.2026 found, not read: same table assumed). no_kirchgeld_states: BY (Art. 9 KirchStG knows no Kirchgeld; confirmed by the law text). Not modelled (member share + note kirchgeld_not_modelled): BW (2025 table not read; the 2016 table started at 30.000), BE, BB, MV, ST (the evangelical tables not read), HB, HH, HE, RP, SL, SH, TH. Kappung (#112, read 2026-10-14): SN 3,5 % of the zvE (Bek. SMF Sachsen Nr. 1 for 2025 v. 28.03.2025, KiStB_2025.pdf; member share of the zvE by the Summe-der-Einkuenfte ratio in glaubensverschiedener Ehe; Bemessungsgrundlage after § 51a EStG), NI 3,5 % (FinMin NI v. 30.04.2025, BStBl. 2025 I S. 1172: 'hoechstens 3,5 % des zu versteuernden Einkommens'; the Nordkirche part of NI caps at 3 %, not modelled), TH 3,5 % (Bek. TFM Thueringen v. 13.02.2025 Nr. 1, finanzamt.thueringen.de/fileadmin/medien_tfm/steuern/kirchensteuerbeschluss_2025_bf.pdf, incl. the member-share rule). Erzbistum Berlin KiStB kath. § 2 (ABl. 12/2024): 3 % (ST 3,5 %) but the evangelical Kirchen of BE / BB / MV / ST not read. NOT confirmed in a primary text for the year, therefore NOT capped (kappung unset): BW (2,75 % ev. Wuerttemberg / 3,5 % ev. Baden and kath., on Antrag), HB, HH (3 % in the 2015 Bek. Finanzbehoerde v. 10.12.2014, no 2025 / 2026 text read), HE, MV, NW, RP, SL, SH, BE, BB, ST (values differ per Kirche, several only on Antrag; secondary sources only: biallo.de, lohnsteuer-kompakt.de, search snippets). BY: no Kappung in the law (BayKirchStG; BVerwG 21.05.2003 - 9 C 12.02), listed in none_states (law text not re-read, secondary summary). Estimate default: the capped KiSt is shown with the note kist_kappung_applied (SN, NI, TH apply it in the assessment, other Laender may need an Antrag). Order with the Kirchgeld comparison (cap first, then the higher of capped KiSt and Kirchgeld) is OPEN. Part-year membership (#113) is not applied."
