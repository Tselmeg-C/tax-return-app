    BE: "0.09"
    BB: "0.09"
    HB: "0.09"
    HH: "0.09"
    HE: "0.09"
    MV: "0.09"
    NI: "0.09"
    NW: "0.09"
    RP: "0.09"
    SL: "0.09"
    SN: "0.09"
    ST: "0.09"
    SH: "0.09"
    TH: "0.09"

