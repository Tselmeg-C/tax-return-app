kinder: # § 32 Abs. 6, § 31 Satz 4, § 66 Abs. 1 EStG (#87)
  provisional: true # amounts are read in the law text; only the two readings named at the end of `source` are unconfirmed
  source: "§ 32 Abs. 6 Satz 1 EStG: je Kind und Steuerpflichtigem 3336 Euro Kinderfreibetrag + 1.464 Euro Freibetrag für den Betreuungs- und Erziehungs- oder Ausbildungsbedarf (BEA), Satz 2 verdoppelt beide bei Zusammenveranlagung, wenn das Kind zu beiden Ehegatten im Kindschaftsverhältnis steht, Satz 5 Zwölftelung je Kalendermonat; § 66 Abs. 1 EStG: Kindergeld 255 Euro monatlich je Kind; § 31 Satz 1 und 4 EStG (Günstigerprüfung, Hinzurechnung des Kindergeldanspruchs für den gesamten VZ, bei nicht zusammenveranlagten Eltern im Umfang des Kinderfreibetrags); § 51a Abs. 2 EStG und § 3 Abs. 2 SolzG 1995 (Bemessungsgrundlage mit den Freibeträgen nach § 32 Abs. 6 in allen Fällen des § 32, ohne Kindergeld-Hinzurechnung). Freibeträge: Art. 1 SteFeG v. 23.12.2024 (BGBl. 2024 I Nr. 449); 2025: 3.306 -> 3.336 (Art. 1 Nr. 1), 2026: 3.336 -> 3.414 (Art. 2 Nr. 1), BEA 1.464 unverändert in beiden Fassungen; Kindergeld 250 -> 255 (Art. 1) -> 259 (Art. 2). Read 2026-10-09 at buzer.de/32_EStG.htm, buzer.de/gesetz/4499/al233617-0.htm (Fassung bis 31.12.2025), buzer.de/gesetz/16838/a321118.htm and a321119.htm, buzer.de/66_EStG.htm, buzer.de/gesetz/4499/al233620-0.htm, buzer.de/31_EStG.htm, buzer.de/51a_EStG.htm, buzer.de/gesetz/282/a3297.htm (§ 3 SolzG 1995); gesetze-im-internet.de was not reachable. UNCONFIRMED (hence provisional): (1) the Günstigerprüfung is done child by child, larger Freibetrag first (the text of § 31 Satz 1 and 4 speaks of the Freistellung 'eines Kindes' but does not state the order for several children; no R 31 EStR / H 31 EStH read); (2) § 35a is capped by the tarifliche ESt including the Kindergeld addition (§ 35a Abs. 1 to 3 'tarifliche Einkommensteuer, vermindert um die sonstigen Steuerermäßigungen' with § 31 Satz 4 'erhöht sich die tarifliche Einkommensteuer'), no Verwaltungsanweisung read; same for § 35a reducing the Bemessungsgrundlage (§ 2 Abs. 6: festzusetzende ESt is after Steuerermäßigungen, § 51a Abs. 2 Satz 3 excludes only § 35). Re-checked 2026-10-13 (#54): amounts 3.414 / 1.464 / 259 confirmed at buzer.de/32_EStG.htm and buzer.de/66_EStG.htm (no amendment after SteFeG Art. 2). Reading (1) partly sourced: BFH v. 18.4.2012 III R 50/08 Rn. 16 says the Vergleichsrechnung is done 'für jedes Kind einzeln' (read at gesetze.co/urteile/III_R_50-08, a mirror, not the BFH site) but states no order of children; searched: BFH, elster forum, web search for R 31 EStR / H 31 EStH / BMF text on the order and on § 35a, not found."
  kinderfreibetrag: "3336" # per parent; joint x 2 (Satz 2)
  bea_freibetrag: "1464" # per parent; joint x 2 (Satz 2)
  kindergeld_per_month: "255" # § 66 Abs. 1

filing: # § 149 Abs. 2 und 3 AO (#92)
  source: "§ 149 Abs. 2 Satz 1 AO (Steuererklärungen für ein Kalenderjahr spätestens sieben Monate nach Ablauf des Kalenderjahres, also 31. Juli 2026) und § 149 Abs. 3 Nr. 1 AO (von Steuerberatern erstellte Einkommensteuererklärungen, ausgenommen Erklärungen nach § 46 Abs. 2 Nr. 8 EStG: spätestens bis zum letzten Tag des Monats Februar des zweiten auf den Besteuerungszeitraum folgenden Kalenderjahres, also 28. Februar 2027), i.d.F. Art. 3 G. v. 29.6.2026 (BGBl. 2026 I Nr. 197) m.W.v. 1.9.2026, Absätze 2 und 3 in diesen Punkten unverändert; keine Verlängerung nach Art. 97 § 36 EGAO (gilt nur für Besteuerungszeiträume 2019 bis 2024, letzter: 30.4.2026 für 2024; Art. 97 § 36 read 2026-10-12 at lxgesetze.de/egao/97-36). Read 2026-10-12 at buzer.de/149_AO.htm; gesetze-im-internet.de was not reachable. The dates are the statutory ones; a Saturday, Sunday or holiday moves the end of the period to the next working day (§ 108 Abs. 3 AO, not applied here)."
  deadline_self: "2026-07-31"
  deadline_advised: "2027-02-28"

haushaltsnahe: # § 35a Abs. 2, 3, 5 EStG (#77)
  source: "§ 35a Abs. 2 Satz 1 EStG (haushaltsnahe Beschäftigungsverhältnisse und Dienstleistungen: 20 Prozent, höchstens 4.000 Euro), Abs. 3 Satz 1 (Handwerkerleistungen: 20 Prozent, höchstens 1.200 Euro), Abs. 5 Satz 2 und 3 (nur Arbeitskosten; Rechnung und unbare Zahlung auf das Konto des Erbringers), Text i.d.F. Art. 4 JStG 2024 (G. v. 2.12.2024, BGBl. 2024 I Nr. 387) m.W.v. 1.1.2025, in der Neufassung v. 8.10.2009 (BGBl. 2009 I S. 3366, 3862); Betraege und Prozentsatz unveraendert seit dem Steuervereinfachungsgesetz 2011 (BGBl. 2011 I S. 2131). Read 2026-10-12 at buzer.de/35a_EStG.htm; gesetze-im-internet.de was not reachable. The 20 percent are taken off the tarifliche Einkommensteuer (Abs. 2/3: ermaessigt sich die tarifliche Einkommensteuer), not off the income."
  rate: "0.20"
  max_dienstleistung: "4000" # Abs. 2 Satz 1
  max_handwerker: "1200" # Abs. 3 Satz 1

entlastungsbetrag: # § 24b Abs. 2, 4 EStG (#81)
  provisional: true # the amounts are read in the law text; the proration for several children is an OPEN reading, see `source`
  source: "§ 24b Abs. 2 Satz 1 EStG (Entlastungsbetrag für Alleinerziehende 4.260 Euro im Kalenderjahr bei einem Kind im Haushalt), Satz 2 (erhöht sich um 240 Euro je weiterem Kind), Abs. 4 (ermäßigt sich für jeden vollen Kalendermonat ohne die Voraussetzungen um ein Zwölftel), Text i.d.F. Art. 4 JStG 2022 (G. v. 16.12.2022, BGBl. 2022 I S. 2294) m.W.v. 1.1.2023, in der Neufassung v. 8.10.2009 (BGBl. 2009 I S. 3366, 3862); Betraege unveraendert seit 2023, buzer.de shows no later version. Read 2026-10-13 at buzer.de/24b_EStG.htm; gesetze-im-internet.de was not reachable. Abgezogen von der Summe der Einkünfte (Abs. 1), also vor Sonderausgaben und agB. UNCONFIRMED (hence provisional): Abs. 4 reduces per full month in which the Abs. 1 conditions (no qualifying child at all) were not met; for several children the law does not prorate the 240 Euro per child, the engine prorates it by the child's own months (a child with the most months carries the 4.260); no R 24b EStR / H 24b EStH read."
  base: "4260" # Abs. 2 Satz 1: first child
  per_further_child: "240" # Abs. 2 Satz 2

sozialversicherung: # §§ 158 SGB VI, 341 SGB III, 241, 242a SGB V, 55 SGB XI, SVBezGrV 2025 (#85, Vorsorge estimate from the gross wage)
  provisional: true # every value was read only in secondary sources (buzer.de, lxgesetze.de, search-result excerpts of the official pages); the Zusatzbeitrag is an assumption (Bundesdurchschnitt), not the person's Kasse
  source: "BBG: Sozialversicherungs-Rechengrößenverordnung 2025 § 4 Abs. 1 Nr. 1 (96.600 Euro, allgemeine RV; ALV gleich) und § 2 Abs. 2 (66.150 Euro, = § 6 Abs. 7 SGB V; KV/PV), Read 2026-10-13 at buzer.de/SVRechGrV_2025.htm. Rates: RV 18,6 % (§ 158 SGB VI, Bekanntmachung der Beitragssätze 2025, BGBl. 2024 I Nr. 368, text read only as a search excerpt); ALV 2,6 % (§ 341 Abs. 2 SGB III) and KV 14,6 % (§ 241 SGB V), read 2026-10-13 at lxgesetze.de; PV 3,6 % from 1.1.2025 by Verordnung der Bundesregierung (Anhebung von 3,4 %; § 55 Abs. 1 SGB XI statute text itself says 3,4 %; the Verordnung text was NOT read, only BMG / TK news), Zuschlag 0,6 und Abschlag 0,25 je Kind ab dem 2. bis zum 5. Kind unter 25 (§ 55 Abs. 3 SGB XI, read as excerpts of lxgesetze.de / search results), Zuschlag allein vom Mitglied (§ 58 Abs. 1 SGB XI, lxgesetze.de). Beschäftigte und Arbeitgeber tragen RV, ALV, KV, PV je zur Hälfte (§ 168 SGB VI, § 346 SGB III, § 249 SGB V, § 58 SGB XI; not read, reading from memory of the system); Sachsen (PV-Mehrbelastung des Arbeitnehmers, § 58 Abs. 3) is NOT applied. Durchschnittlicher Zusatzbeitragssatz 2,5 % (BMG-Bekanntmachung nach § 242a Abs. 2 SGB V, Bundesanzeiger 7.11.2024; seen only in search excerpts, the Bekanntmachung itself not read). Übergangsbereich 2.000 Euro (§ 20 Abs. 2 SGB IV, lxgesetze.de). gesetze-im-internet.de was not reachable."
  bbg_rv: "96600" # also the ALV limit (§ 341 Abs. 4 SGB III)
  bbg_kv: "66150" # KV and PV (§ 223 Abs. 3, § 6 Abs. 7 SGB V; § 55 Abs. 2 SGB XI)
  rv_rate: "0.186" # employee 9,3 %
  alv_rate: "0.026" # employee 1,3 %
  kv_rate: "0.146" # employee 7,3 %
  kv_zusatz_average: "0.025" # employee half
  pv_rate: "0.036" # employee 1,8 %
  pv_childless_surcharge: "0.006" # § 55 Abs. 3 Satz 1: from the end of the month of the 23rd birthday, employee alone (§ 58 Abs. 1 Satz 2)
  pv_child_abschlag: "0.0025" # § 55 Abs. 3 Satz 3: per child from the 2nd to the 5th, until the child is 25
  pv_abschlag_max_steps: 4
  uebergangsbereich_upper_monthly: "2000" # § 20 Abs. 2 SGB IV; the estimate assumes 12 months, so wages up to 24 000 get none

