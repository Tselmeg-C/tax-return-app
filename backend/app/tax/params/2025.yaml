progressionsvorbehalt: # § 32b EStG (#86)
  provisional: true # only the rounding of the besonderer Steuersatz is unconfirmed (see source)
  source: "§ 32b Abs. 1 Satz 1 Nr. 1 Buchst. a bis k EStG (Lohnersatzleistungen: Arbeitslosengeld, Kurzarbeitergeld, Insolvenzgeld, Krankengeld, Mutterschaftsgeld, Elterngeld u. a.) und § 32b Abs. 2 Nr. 1 EStG (besonderer Steuersatz = Steuersatz auf zvE + Summe der Leistungen nach Abzug des Arbeitnehmer-Pauschbetrags, soweit nicht bei den Einkünften aus nichtselbständiger Arbeit abziehbar), i.d.F. der Neufassung v. 8.10.2009 (BGBl. 2009 I S. 3366, 3862), zuletzt geändert durch Art. 7 G. v. 29.6.2026 (BGBl. 2026 I Nr. 197); § 32b Abs. 3 (Bescheinigung der Träger nach § 93c AO) is data delivery only. Read 2026-10-09 at buzer.de/32b_EStG.htm; gesetze-im-internet.de was not reachable. The law text has no rounding rule for the rate and no minimum rate; the rule the Finanzverwaltung applies (e.g. 4 decimals, R 32b EStR) is UNCONFIRMED, therefore rate_decimals exact and provisional true (issue #86 Decision 4). searched 2026-10-13 (#54): web search for R 32b EStR / H 32b EStH / BMF text on the rounding of the besonderer Steuersatz, not found."
  rate_decimals: "exact" # "exact" or a digit string "0".."8"

