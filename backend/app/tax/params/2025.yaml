# Tax parameters for Veranlagungszeitraum 2025. Sections are owned by issues (#14 Decision 2):
# year + mapping: #9; tariff, soli, church_tax: #14; werbungskosten, sonderausgaben: #15; vorsorge: #16; progressionsvorbehalt: #86; agb: #76; later sections: #77, #87.
# Money and rates are quoted strings (Decimal); an unquoted number fails to load.
year: 2025

tariff: # § 32a Abs. 1 EStG
  source: "§ 32a Abs. 1 EStG i.d.F. Art. 1 SteFeG v. 23.12.2024 (BGBl. 2024 I Nr. 449), anzuwenden ab VZ 2025; https://www.gesetze-im-internet.de/estg/__32a.html (the current text shows VZ 2026; the VZ 2025 text is Art. 1 Nr. 2 SteFeG, checked 2026-10-07 via buzer.de/gesetz/16838/a321118.htm)"
  grundfreibetrag: "12096" # Nr. 1: zvE ≤ grundfreibetrag → 0
  zone2: {upper: "17443", a: "932.30", b: "1400"} # Nr. 2: (a·y + b)·y, y = (zvE − grundfreibetrag) / 10000
  zone3: {upper: "68480", a: "176.64", b: "2397", c: "1015.13"} # Nr. 3: (a·z + b)·z + c, z = (zvE − zone2.upper) / 10000
  zone4: {upper: "277825", rate: "0.42", minus: "10911.92"} # Nr. 4: rate·x − minus
  zone5: {rate: "0.45", minus: "19246.67"} # Nr. 5: rate·x − minus

