sonderausgaben: # §§ 10 Abs. 1 Nr. 4, 5, 9, 10b Abs. 1, 10c EStG (#15)
  source: "§ 10c EStG (Sonderausgaben-Pauschbetrag 36 Euro, doppelt bei Zusammenveranlagung; Fassung Art. 5 ZollkodexAnpG v. 22.12.2014, BGBl. 2014 I S. 2417, unverändert); § 10b Abs. 1 Satz 1 Nr. 1 EStG (20 % des Gesamtbetrags der Einkünfte; VZ 2026: Art. 2 StÄndG 2025 ändert nur Abs. 2); § 10 Abs. 1 Nr. 5 EStG i.d.F. Art. 4 JStG 2024 v. 2.12.2024 (BGBl. 2024 I Nr. 387), m.W.v. 1.1.2025: 80 % der Aufwendungen, höchstens 4.800 Euro je Kind (vorher zwei Drittel / 4.000 Euro), Kind unter 14 Jahren, Rechnung und Überweisung (Satz 4); § 10 Abs. 1 Nr. 9 EStG: 30 % des Entgelts, höchstens 5.000 Euro (cap on the deductible amount, reading of the sentence, see PR), Schule in freier Trägerschaft, ohne Beherbergung, Betreuung, Verpflegung; § 10 Abs. 1 Nr. 4 EStG (gezahlte Kirchensteuer). Read 2026-10-08 at buzer.de/10_EStG.htm, 10b_EStG.htm, 10c_EStG.htm and buzer.de/gesetz/4499/al210133-0.htm (a.F. before JStG 2024); gesetze-im-internet.de was not reachable. § 4f EStG named in the issue is Schuldübernahme and not relevant."
  pauschbetrag_single: "36" # § 10c Satz 1
  pauschbetrag_joint: "72" # § 10c Satz 2
  spenden_max_share_of_gde: "0.20" # § 10b Abs. 1 Satz 1 Nr. 1
  kinderbetreuung: {share: "0.80", max_per_child: "4800", age_limit: 14} # § 10 Abs. 1 Nr. 5
  schulgeld: {share: "0.30", max_per_child: "5000"} # § 10 Abs. 1 Nr. 9

vorsorge: # § 10 Abs. 1 Nr. 2, 3, 3a, Abs. 3, 4 EStG (#16)
  source: "§ 10 Abs. 3 Satz 1 EStG (Höchstbeitrag zur knappschaftlichen Rentenversicherung, aufgerundet; 100 % ab VZ 2023, Satz 6), Fassung Art. 4 JStG 2024 v. 2.12.2024 (BGBl. 2024 I Nr. 387) m.W.v. 1.1.2025, no later version of Abs. 1 Nr. 2/3/3a, Abs. 3, 4 in the version list; § 10 Abs. 4 Satz 1, 2 (2.800 / 1.900 Euro); § 10 Abs. 1 Nr. 3 Buchst. a Satz 4 (Kürzung um 4 Prozent). Höchstbetrag 2026: § 4 Abs. 1 Nr. 2 SVBezGrV 2026 (knappschaftliche BBG 124 800 Euro, V. v. 24.11.2025 BGBl. 2025 I Nr. 278) x Beitragssatz 24,7 % (Bekanntmachung v. 24.11.2025 BGBl. 2025 I Nr. 291) = 30.825,60, aufgerundet 30.826. Read 2026-10-09 at buzer.de/10_EStG.htm, lxgesetze.de/svbezgrv-2026/4, buzer.de/SVRechGrV_2026.htm and the Bekanntmachung text (jurawelt mirror of gesetze-im-internet.de); gesetze-im-internet.de itself was not reachable."
  altersvorsorge_hoechstbetrag: "30826" # joint: doubled in code (Satz 2)
  krankengeld_cut: "0.04" # Nr. 3 Buchst. a Satz 4
  basis_cap: "2800" # Abs. 4 Satz 1
  basis_cap_reduced: "1900" # Abs. 4 Satz 2

progressionsvorbehalt: # § 32b EStG (#86)
  provisional: true # only the rounding of the besonderer Steuersatz is unconfirmed (see source)
  source: "§ 32b Abs. 1 Satz 1 Nr. 1 Buchst. a bis k EStG (Lohnersatzleistungen: Arbeitslosengeld, Kurzarbeitergeld, Insolvenzgeld, Krankengeld, Mutterschaftsgeld, Elterngeld u. a.) und § 32b Abs. 2 Nr. 1 EStG (besonderer Steuersatz = Steuersatz auf zvE + Summe der Leistungen nach Abzug des Arbeitnehmer-Pauschbetrags, soweit nicht bei den Einkünften aus nichtselbständiger Arbeit abziehbar), i.d.F. der Neufassung v. 8.10.2009 (BGBl. 2009 I S. 3366, 3862), zuletzt geändert durch Art. 7 G. v. 29.6.2026 (BGBl. 2026 I Nr. 197); § 32b Abs. 3 (Bescheinigung der Träger nach § 93c AO) is data delivery only. Read 2026-10-09 at buzer.de/32b_EStG.htm; gesetze-im-internet.de was not reachable. The law text has no rounding rule for the rate and no minimum rate; the rule the Finanzverwaltung applies (e.g. 4 decimals, R 32b EStR) is UNCONFIRMED, therefore rate_decimals exact and provisional true (issue #86 Decision 4)."
  rate_decimals: "exact" # "exact" or a digit string "0".."8"

kinder: # § 32 Abs. 6, § 31 Satz 4, § 66 Abs. 1 EStG (#87)
  provisional: true # amounts are read in the law text; only the two readings named at the end of `source` are unconfirmed
  source: "§ 32 Abs. 6 Satz 1 EStG: je Kind und Steuerpflichtigem 3414 Euro Kinderfreibetrag + 1.464 Euro Freibetrag für den Betreuungs- und Erziehungs- oder Ausbildungsbedarf (BEA), Satz 2 verdoppelt beide bei Zusammenveranlagung, wenn das Kind zu beiden Ehegatten im Kindschaftsverhältnis steht, Satz 5 Zwölftelung je Kalendermonat; § 66 Abs. 1 EStG: Kindergeld 259 Euro monatlich je Kind; § 31 Satz 1 und 4 EStG (Günstigerprüfung, Hinzurechnung des Kindergeldanspruchs für den gesamten VZ, bei nicht zusammenveranlagten Eltern im Umfang des Kinderfreibetrags); § 51a Abs. 2 EStG und § 3 Abs. 2 SolzG 1995 (Bemessungsgrundlage mit den Freibeträgen nach § 32 Abs. 6 in allen Fällen des § 32, ohne Kindergeld-Hinzurechnung). Freibeträge: Art. 2 SteFeG v. 23.12.2024 (BGBl. 2024 I Nr. 449); 2025: 3.306 -> 3.336 (Art. 1 Nr. 1), 2026: 3.336 -> 3.414 (Art. 2 Nr. 1), BEA 1.464 unverändert in beiden Fassungen; Kindergeld 250 -> 255 (Art. 1) -> 259 (Art. 2). Read 2026-10-09 at buzer.de/32_EStG.htm, buzer.de/gesetz/4499/al233617-0.htm (Fassung bis 31.12.2025), buzer.de/gesetz/16838/a321118.htm and a321119.htm, buzer.de/66_EStG.htm, buzer.de/gesetz/4499/al233620-0.htm, buzer.de/31_EStG.htm, buzer.de/51a_EStG.htm, buzer.de/gesetz/282/a3297.htm (§ 3 SolzG 1995); gesetze-im-internet.de was not reachable. UNCONFIRMED (hence provisional): (1) the Günstigerprüfung is done child by child, larger Freibetrag first (the text of § 31 Satz 1 and 4 speaks of the Freistellung 'eines Kindes' but does not state the order for several children; no R 31 EStR / H 31 EStH read); (2) § 35a is capped by the tarifliche ESt including the Kindergeld addition (§ 35a Abs. 1 to 3 'tarifliche Einkommensteuer, vermindert um die sonstigen Steuerermäßigungen' with § 31 Satz 4 'erhöht sich die tarifliche Einkommensteuer'), no Verwaltungsanweisung read; same for § 35a reducing the Bemessungsgrundlage (§ 2 Abs. 6: festzusetzende ESt is after Steuerermäßigungen, § 51a Abs. 2 Satz 3 excludes only § 35)."
  kinderfreibetrag: "3414" # per parent; joint x 2 (Satz 2)
  bea_freibetrag: "1464" # per parent; joint x 2 (Satz 2)
  kindergeld_per_month: "259" # § 66 Abs. 1

