werbungskosten: # §§ 9, 9a EStG, § 4 Abs. 5 Satz 1 Nr. 6c EStG (#15)
  source: "§ 9a Satz 1 Nr. 1 Buchst. a EStG (1.230 Euro) und Satz 3 (neu: Beitragszahlungen an Gewerkschaften, § 9 Abs. 1 Satz 3 Nr. 3, werden neben den Pauschbeträgen berücksichtigt) i.d.F. Art. 2 Nr. 4 StÄndG 2025 v. 22.12.2025 (BGBl. 2025 I Nr. 363), m.W.v. 1.1.2026; § 9 Abs. 1 Satz 3 Nr. 4 Satz 2 EStG i.d.F. Art. 2 Nr. 3 StÄndG 2025 (0,38 Euro je Kilometer ab dem ersten km, Satz 8 aufgehoben; Höchstbetrag 4.500 Euro bei Nicht-Kfz-Nutzung); § 4 Abs. 5 Satz 1 Nr. 6c i.V.m. § 9 Abs. 5 Satz 1 EStG (Tagespauschale 6 Euro, höchstens 1.260 Euro; unverändert). Read 2026-10-08 at buzer.de/9_EStG.htm, 9a_EStG.htm, 4_EStG.htm and buzer.de/gesetz/17325/a335478.htm (Art. 2 StÄndG 2025); gesetze-im-internet.de was not reachable."
