# Golden service scenarios (#17), VZ 2025. Each `chain` is derived by hand from the law (the
# paragraph is on the line); the tariff values come ONLY from the BMF Einkommensteuerrechner
# (`bmf_inputs_2025.yaml`, key = `bmf`), never from the engine. `expected` is compared to
# `GET /summary` to the cent. Money in `setup` is a dot-decimal string. Persons are fictional.
#
# Rates used by hand (params 2025): Arbeitnehmer-Pauschbetrag 1.230 (§ 9a), Sonderausgaben-
# Pauschbetrag 36 / 72 (§ 10c), Entfernungspauschale 0,30 EUR/km (§ 9 Abs. 1 Nr. 4),
# Homeoffice 6 EUR/Tag (§ 4 Abs. 5 Nr. 6c), Basiskranken-Deckel 1.900 / 2.800 (§ 10 Abs. 4),
# Kindergeld 255 EUR/Monat (§ 66), Kinderfreibetrag + BEA 4.800 EUR je Elternteil (§ 32 Abs. 6).
scenarios:
  - id: s1_single_wage_commute
    title: "Single, Steuerklasse I, commute + Homeoffice below the Pauschbetrag, Vorsorge from the LStB"
    persons: {a: {kind: adult}}
    profile: {filing: single, bundesland: be, taxpayer: a}
    employments:
      - {person: a, steuerklasse: "1", commute_km: 10, office_days: 100, homeoffice_days: 40,
         gross_wage: "52000.00", lohnsteuer: "9800.00", rv_employee: "4836.00", kv: "4000.00", pv: "900.00"}
    chain:
      - "Entfernungspauschale 10 km x 100 Tage x 0,30 = 300; Homeoffice 40 x 6 = 240; Summe 540 < 1.230, also Pauschbetrag 1.230 (§ 9a Nr. 1a)"
      - "Einkuenfte N = 52.000 - 1.230 = 50.770 = GdE (§ 2 Abs. 3)"
      - "Sonderausgaben: Pauschbetrag 36 (§ 10c)"
      - "Altersvorsorge: 4.836 + AG-Anteil 4.836 = 9.672 (<= 29.344), abzgl. AG-Anteil = 4.836 (§ 10 Abs. 1 Nr. 2, Abs. 3 Satz 5)"
      - "Basiskranken: KV 4.000 x 0,96 = 3.840 + PV 900 = 4.740; Nr. 3 voll abziehbar auch ueber 1.900 (§ 10 Abs. 4 Satz 4)"
      - "Vorsorge gesamt 4.836 + 4.740 = 9.576; zvE = 50.770 - 36 - 9.576 = 41.158 (BMF: ESt 7.693, Soli 0)"
      - "Erstattung = 9.800 - 7.693 - 0 = 2.107"
    bmf: [s1_single_41158]
    expected:
      gde: "50770.00"
      zve_before_children: "41158.00"
      zve: "41158.00"
      tarifliche_est: "7693.00"
      ermaessigung_35a: "0.00"
      festzusetzende_est: "7693.00"
      soli: "0.00"
      kirchensteuer: "0.00"
      kindergeld_added: "0.00"
      withheld: {lohnsteuer: "9800.00", soli: "0.00", kirchensteuer: "0.00"}
      refund: "2107.00"
      pflicht: {state: voluntary, reasons: []}
      what_missing: []

