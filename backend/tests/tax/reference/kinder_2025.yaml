# Hand-computed Kinderfreibetrag + BEA and Kindergeld per child (#87 K1), VZ 2025; see README.md.
- id: K1_half_0m
  rule: K1
  source: § 32 Abs. 6 Satz 1, 2, 5 EStG, § 66 Abs. 1, 2 EStG, § 31 Satz 4 EStG
  input: {months: 0, half: true}
  arithmetic: Freibetrag = (3336 + 1464) x 1 x 0 / 12 = 0; Kindergeld = 255 x 0 x 1 / 2 = 0
  expected: {freibetrag: '0', kindergeld: '0'}
