  input: {filing: single, children: 0, gde: '60000'}
  arithmetic: '15340 x 5% = 767,00; (51130 - 15340) = 35790 x 6% = 2147,40; (60000 - 51130) = 8870 x 7% = 620,90; sum 3535,30'
  expected: '3535.30'
