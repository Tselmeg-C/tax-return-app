# Hand-computed reference cases for the Progressionsvorbehalt, VZ 2025 (#86); see README.md.
# Tariff values ESt(b) are those of #14 (BMF-proven values at the building blocks, blocks_2025.yaml).
- id: P1_single
  rule: P
  source: § 32b Abs. 2 Nr. 1 EStG
  input: {filing: single, zve: '40000', lohnersatz: '15000'}
  arithmetic: 'b = 55000; ESt(55000) = 12509; 40000 x 12509 / 55000 = 9097,45'
  expected: '9097'
  plain: '7320'
- id: P3_joint_exact
  rule: P
  source: § 32b Abs. 2 Nr. 1 EStG
  input: {filing: joint, zve: '100000', lohnersatz: '20000'}
  arithmetic: 'b = 120000; joint ESt = 28830; 100000 x 28830 / 120000 = 24025,00 exactly'
  expected: '24025'
  plain: '21382'
- id: P5_low_zve
  rule: P
  source: § 32b Abs. 2 Nr. 1 EStG
  input: {filing: single, zve: '10000', lohnersatz: '15000'}
  arithmetic: 'b = 25000; ESt = 2927; 10000 x 2927 / 25000 = 1170,8'
  expected: '1170'
  plain: '0'
- id: P6_zve_zero
  rule: P
  source: § 32b Abs. 2 Nr. 1 EStG
  input: {filing: single, zve: '0', lohnersatz: '10000'}
  arithmetic: 'x = 0'
  expected: '0'
- id: P7_below_gfb_sum
  rule: P
  source: § 32b Abs. 2 Nr. 1 EStG
  input: {filing: single, zve: '12000', lohnersatz: '5000'}
  arithmetic: 'b = 17000; ESt = 910; 12000 x 910 / 17000 = 642,35'
  expected: '642'
- id: P8_no_benefit
  rule: P
  source: § 32b Abs. 2 Nr. 1 EStG
  input: {filing: single, zve: '40000', lohnersatz: '0'}
  arithmetic: 'lohnersatz 0 = income_tax'
  expected: '7320'
- id: P9_rate_4_decimals
  rule: P
  source: § 32b Abs. 2 Nr. 1 EStG
  input: {filing: single, zve: '40000', lohnersatz: '15000', rate_decimals: '4'}
  arithmetic: 'rate = floor(0,227436, 4) = 0,2274; 40000 x 0,2274 = 9096'
  expected: '9096'
- id: P12_negative_zve
  rule: P
  source: § 32b Abs. 2 Nr. 1 EStG
  input: {filing: single, zve: '-500', lohnersatz: '10000'}
  arithmetic: 'x = 0'
  expected: '0'
- id: P13_cents
  rule: P
  source: § 32b Abs. 2 Nr. 1 EStG
  input: {filing: single, zve: '40000.99', lohnersatz: '15000.50'}
  arithmetic: 'x = 40000; b = floor(55001,49) = 55001; ESt(55001) = 12509; 40000 x 12509 / 55001 = 9097,29'
  expected: '9097'
- id: U1_no_wages
  rule: U
  source: § 32b Abs. 2 Nr. 1 EStG
  input: {filing: single, benefits: [{person: A, amount: '10000', deducted: '0'}]}
  arithmetic: 'unused 1230; 10000 - 1230'
  expected: '8770'
- id: U2_small_wages
  rule: U
  source: § 32b Abs. 2 Nr. 1 EStG
  input: {filing: single, benefits: [{person: A, amount: '5000', deducted: '800'}]}
  arithmetic: 'unused 1230 - 800 = 430; 5000 - 430'
  expected: '4570'
- id: U3_full_wages
  rule: U
  source: § 32b Abs. 2 Nr. 1 EStG
  input: {filing: single, benefits: [{person: A, amount: '5000', deducted: '1230'}]}
  arithmetic: 'unused 0'
  expected: '5000'
- id: U4_below_pauschbetrag
  rule: U
  source: § 32b Abs. 2 Nr. 1 EStG
  input: {filing: single, benefits: [{person: A, amount: '1000', deducted: '0'}]}
  arithmetic: 'max(0; 1000 - 1230)'
  expected: '0'
- id: U5_joint
  rule: U
  source: § 32b Abs. 2 Nr. 1 EStG
  input: {filing: joint, benefits: [{person: A, amount: '6000', deducted: '1230'}, {person: B, amount: '12000', deducted: '0'}]}
  arithmetic: '6000 + (12000 - 1230)'
  expected: '16770'
- id: U6_actual_wk_above
  rule: U
  source: § 32b Abs. 2 Nr. 1 EStG
  input: {filing: single, benefits: [{person: A, amount: '5000', deducted: '2000'}]}
  arithmetic: 'unused max(0; 1230 - 2000) = 0'
  expected: '5000'
- id: U7_two_benefits
  rule: U
  source: § 32b Abs. 2 Nr. 1 EStG
  input: {filing: single, benefits: [{person: A, amount: '3000', deducted: '0'}, {person: A, amount: '2000', deducted: '0'}]}
  arithmetic: '5000 - 1230'
  expected: '3770'
- id: U8_outside_return
  rule: U
  source: § 32b Abs. 2 Nr. 1 EStG
  input: {filing: single, benefits: [{person: X, amount: '4000', deducted: '0'}]}
  arithmetic: 'ignored + person_not_in_return'
  expected: '0'
  notes: [person_not_in_return]
