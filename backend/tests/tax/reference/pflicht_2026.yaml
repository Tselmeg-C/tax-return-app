# Reference cases for the Pflichtveranlagung check, VZ 2026 (#92); see README.md.
# Hand-derived from the law text of § 46 Abs. 2 EStG (buzer.de, read 2026-10-12) and § 149 AO.
# input: filing, advised, today, employments [person, klasse, factor, concurrent], persons [person, lohnersatz, other]
- id: single_one_job_klasse1
  source: § 46 Abs. 2 EStG (keine Nummer erfüllt)
  arithmetic: 'one employment, no Lohnersatz, other income unknown: no Nr. 1 to 3a applies'
  input: {filing: single, today: '2027-06-01', employments: [{person: A, klasse: '1'}], persons: [{person: A, lohnersatz: '0', other: '0'}]}
  expected: {state: voluntary, reasons: [], deadline: '2030-12-31', kind: voluntary, overdue: false}
- id: single_other_income_unknown
