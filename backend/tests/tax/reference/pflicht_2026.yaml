  arithmetic: 'other_income null: not decidable, listed in not_checked'
  input: {filing: single, today: '2027-06-01', employments: [{person: A, klasse: '1'}], persons: [{person: A, lohnersatz: '0', other: null}]}
  expected: {state: voluntary, reasons: [], not_checked_has: [side_income_not_checked, freibetrag_39a, finanzamt_request], deadline: '2030-12-31', kind: voluntary, overdue: false}
