# Hand-computed reference cases for the Vorsorge estimate from the gross wage, VZ 2026 (#85). Employee shares, each branch
# rounded half-even to cents. A case may only change together with its `arithmetic` (README.md).
- id: S1_below_both_bbg_childless
  source: "§ 168 SGB VI, § 346 SGB III, § 249 SGB V, § 58 SGB XI (halbe Beiträge); § 55 Abs. 3 SGB XI; BBG und Sätze der params 2026.yaml (`sozialversicherung.source`)"
  input:
    wage: '60000.00'
    children_under_25: 0
    childless_surcharge: true
  arithmetic: "RV 60000 x 0.093 = 5580; KV 60000 x 0.0875 = 5250; PV rate 0.018 + 0.006 = 0.024, 60000 x 0.024 = 1440; ALV 60000 x 0.013 = 780"
  expected: 
    rv_employee: '5580.00'
    rv_employer: '5580.00'
    kv: '5250.00'
    pv: '1440.00'
    alv: '780.00'
- id: S2_between_bbg_one_child
  source: "§ 168 SGB VI, § 346 SGB III, § 249 SGB V, § 58 SGB XI (halbe Beiträge); § 55 Abs. 3 SGB XI; BBG und Sätze der params 2026.yaml (`sozialversicherung.source`)"
  input:
    wage: '85000.00'
    children_under_25: 1
    childless_surcharge: false
  arithmetic: "RV 85000 x 0.093 = 7905 (85000 < 101400); KV min(85000, 69750) = 69750 x 0.0875 = 6103.125, tie rounds half-even to 6103.12; PV 69750 x 0.018 = 1255.50; ALV 85000 x 0.013 = 1105"
  expected: 
    rv_employee: '7905.00'
    rv_employer: '7905.00'
    kv: '6103.12'
    pv: '1255.50'
    alv: '1105.00'
