    alv: '390.00'
- id: S5_six_children_abschlag_capped
  source: "§ 168 SGB VI, § 346 SGB III, § 249 SGB V, § 58 SGB XI (halbe Beiträge); § 55 Abs. 3 SGB XI; BBG und Sätze der params 2025.yaml (`sozialversicherung.source`)"
  input:
    wage: '50000.00'
    children_under_25: 6
    childless_surcharge: false
  arithmetic: "RV 50000 x 0.093 = 4650; KV 50000 x 0.0855 = 4275; Abschlag steps min(6 - 1, 4) = 4: PV rate 0.018 - 4 x 0.0025 = 0.008, 50000 x 0.008 = 400; ALV 50000 x 0.013 = 650"
  expected: 
    rv_employee: '4650.00'
    rv_employer: '4650.00'
    kv: '4275.00'
    pv: '400.00'
    alv: '650.00'
