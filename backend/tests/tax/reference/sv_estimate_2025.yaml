# Hand-computed reference cases for the Vorsorge estimate from the gross wage, VZ 2025 (#85). Employee shares, each branch
# rounded half-even to cents. A case may only change together with its `arithmetic` (README.md).
- id: S1_below_both_bbg_childless
  source: "§ 168 SGB VI, § 346 SGB III, § 249 SGB V, § 58 SGB XI (halbe Beiträge); § 55 Abs. 3 SGB XI; BBG und Sätze der params 2025.yaml (`sozialversicherung.source`)"
  input:
    wage: '60000.00'
    children_under_25: 0
    childless_surcharge: true
  arithmetic: "RV 60000 x 0.093 = 5580; KV 60000 x 0.0855 = 5130; PV rate 0.018 + 0.006 = 0.024, 60000 x 0.024 = 1440; ALV 60000 x 0.013 = 780"
  expected: 
    rv_employee: '5580.00'
    rv_employer: '5580.00'
    kv: '5130.00'
    pv: '1440.00'
    alv: '780.00'
- id: S2_between_bbg_one_child
  source: "§ 168 SGB VI, § 346 SGB III, § 249 SGB V, § 58 SGB XI (halbe Beiträge); § 55 Abs. 3 SGB XI; BBG und Sätze der params 2025.yaml (`sozialversicherung.source`)"
  input:
    wage: '80000.00'
    children_under_25: 1
    childless_surcharge: false
  arithmetic: "RV 80000 x 0.093 = 7440 (80000 < 96600); KV min(80000, 66150) = 66150 x 0.0855 = 5655.825, tie rounds half-even to 5655.82; PV 66150 x 0.018 = 1190.70 (one child: no surcharge, no Abschlag); ALV 80000 x 0.013 = 1040"
  expected: 
    rv_employee: '7440.00'
    rv_employer: '7440.00'
    kv: '5655.82'
    pv: '1190.70'
    alv: '1040.00'
- id: S3_above_both_bbg_three_children
  source: "§ 168 SGB VI, § 346 SGB III, § 249 SGB V, § 58 SGB XI (halbe Beiträge); § 55 Abs. 3 SGB XI; BBG und Sätze der params 2025.yaml (`sozialversicherung.source`)"
  input:
    wage: '120000.00'
    children_under_25: 3
    childless_surcharge: false
  arithmetic: "RV min(120000, 96600) x 0.093 = 8983.8; KV 66150 x 0.0855 = 5655.825 -> 5655.82; PV rate 0.018 - 2 x 0.0025 = 0.013, 66150 x 0.013 = 859.95; ALV 96600 x 0.013 = 1255.8"
  expected: 
    rv_employee: '8983.80'
    rv_employer: '8983.80'
    kv: '5655.82'
    pv: '859.95'
    alv: '1255.80'
- id: S4_two_children
  source: "§ 168 SGB VI, § 346 SGB III, § 249 SGB V, § 58 SGB XI (halbe Beiträge); § 55 Abs. 3 SGB XI; BBG und Sätze der params 2025.yaml (`sozialversicherung.source`)"
  input:
    wage: '30000.00'
    children_under_25: 2
    childless_surcharge: false
  arithmetic: "RV 30000 x 0.093 = 2790; KV 30000 x 0.0855 = 2565; PV rate 0.018 - 1 x 0.0025 = 0.0155, 30000 x 0.0155 = 465; ALV 30000 x 0.013 = 390"
  expected: 
    rv_employee: '2790.00'
    rv_employer: '2790.00'
    kv: '2565.00'
