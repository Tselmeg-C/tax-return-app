# Alembic config. The database URL is NOT stored here: env.py reads it from
# app.config.Settings (DATABASE_URL), or from config.attributes["database_url"]
# when Alembic is driven programmatically (tests).
# Migrations run only in Railway's pre-deploy step (backend/railway.toml).

[alembic]
script_location = app/db/migrations
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
path_separator = os

[post_write_hooks]

# Logging is configured in env.py (JSON lines, same format as the api and worker).
