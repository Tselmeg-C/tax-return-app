# Generator spec for bills_v0: the single source of truth of the dataset.
#
# Every case: template, rendering variant, tags, the values printed on the document (`doc`)
# and the expected label (`expected`, written to label.yaml as is). Vendor, recipient
# (= expected.person_hint), dates and payment method are printed from `expected` unless
# `doc` overrides them. Templates check that the printed total equals expected.gross_amount.
#
# Everything here is fictional: "Muster" people, "Beispiel" / "Muster" vendors, Musterstadt
# addresses, masked Steuer-ID and IBAN. Never put real data in this file (the repo is public).
#
#   uv run python -m evals.synth --dataset bills_v0          # regenerate
#   uv run python -m evals.synth --dataset bills_v0 --check  # verify the committed files

seed: 20251005

manifest:
  name: bills_v0
  description: >-
    Synthetic bills and certificates for the bill pipeline (classify, extract, map).
    Rendered from evals/synth/specs/bills_v0.yaml; fictional people and vendors only.
  label_schema_version: 1
  coverage_exempt:
    wk_homeoffice: "Pauschale without a Beleg; entered in the profile (#13), not extracted from a document."
    v_afa: "Computed from property data (#13 / #20), no single Beleg represents it."
  min_cases: 50
  min_cases_per_group:
    werbungskosten: 12
    vorsorge: 6
    sonderausgaben: 4
    kind: 3
    agb: 5
    haushaltsnahe: 6
    vermietung: 4
    kapital: 1
    irrelevant: 10
    official_no_category: 4
  min_category_cases:
    wk_arbeitsmittel: 2
    wk_fortbildung: 2
    spenden: 3
    kirchensteuer: 1
    kinderbetreuung: 2
    schulgeld: 1
    krankheitskosten: 3
    pflege: 1
    behinderung: 1
    haushaltsnahe_dienstleistung: 3
    handwerkerleistung: 3
  min_official_docs: 4
  min_variant_share:
    pdf_text: 0.40
    pdf_scanned: 0.10
    photo_jpeg: 0.30
  min_variant_cases:
    png: 1
  required_tags:
    - cash_35a
    - material_and_labour
    - mixed_receipt
    - abfluss_year_boundary
    - credit_note
    - multi_page
    - english_language
    - duplicate_rephotographed
    - steuerberatung_split
    - no_payment_date

