# Railway config as code for the `api` service (root directory /backend).
# In the Railway UI set the config file path to /backend/railway.toml (absolute path).
# Secrets and connection strings are Railway variables, never set here.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["/backend/**"]

[deploy]
# Runs once per deployment, before the new version starts. If it fails, the new
# deployment is not activated and the previous one keeps serving.
preDeployCommand = "alembic upgrade head"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# Seconds Railway waits after SIGTERM before SIGKILL: covers honcho's own shutdown (worker
# grace 3 s, honcho KILL_WAIT 5 s). With a volume the old deployment stops before the new one
# starts, so uploads during a deploy can fail with a 5xx (the UI offers "Erneut hochladen").
drainingSeconds = 15
