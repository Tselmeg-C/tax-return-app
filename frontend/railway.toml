# Railway config as code for the `web` service (root directory /frontend).
# In the Railway UI set the config file path to /frontend/railway.toml (absolute path).
# Secrets are Railway variables, never set here.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["/frontend/**"]

[deploy]
# /healthz never calls the api, so a down api or DB does not block a web deploy.
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
